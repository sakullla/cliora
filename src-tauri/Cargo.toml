[package]
name = "cliora"
version = "0.1.0"
description = "Cliora desktop CLI manager"
edition = "2021"
rust-version = "1.88"

[lib]
name = "cliora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.10", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
keyring = "4.2"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
