[package]
name = "cliora"
version = "0.2.4"
description = "Cliora desktop CLI manager"
edition = "2021"
rust-version = "1.88"

[lib]
name = "cliora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.10", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memchr = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
keyring = "4.2"
thiserror = "2"
toml_edit = "0.25"
toml = "1.1"
jsonc-parser = { version = "0.34", features = ["serde", "cst"] }
sha2 = "0.10"
uuid = { version = "1.26", features = ["v4", "serde"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
zip = { version = "8.6", default-features = false, features = ["deflate"] }
url = "2"
base64 = "0.22"
chacha20poly1305 = "0.10"
rand = "0.9"
dirs = "7"
chrono = { version = "0.4", features = ["serde"] }
argon2 = "0.5"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"

# Keep the real 64 MiB / 3-pass KDF in tests; optimize only its CPU-bound dependencies.
[profile.test.package.argon2]
opt-level = 3

[profile.test.package.blake2]
opt-level = 3

# Optimize the test executable's generic crypto/JSON code without rebuilding every dependency.
[profile.test.package.cliora]
opt-level = 1
