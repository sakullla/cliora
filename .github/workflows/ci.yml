name: Pull request validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  rust:
    name: Rust tests and clippy
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Tauri system dependencies
        timeout-minutes: 10
        run: bash .github/scripts/install-linux-deps.sh

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-workspace-crates: true
          cache-bin: false

      - name: Test
        timeout-minutes: 15
        run: /usr/bin/time -v timeout --signal=TERM --kill-after=15s 12m strace -f -e trace=kill,tgkill -o "$RUNNER_TEMP/rust-signals.log" cargo test --manifest-path src-tauri/Cargo.toml -- --test-threads=4

      - name: Test termination diagnostics
        if: failure()
        run: |
          tail -100 "$RUNNER_TEMP/rust-signals.log" || true
          cat /sys/fs/cgroup/memory.events /sys/fs/cgroup/memory.peak || true
          sudo dmesg -T | grep -E 'oom-kill|Out of memory|Killed process' | tail -20 || true

      - name: Clippy
        timeout-minutes: 10
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets

  rust-macos:
    name: Rust macOS target check
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-workspace-crates: true
          cache-bin: false

      - name: Check macOS target
        run: cargo check --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin
