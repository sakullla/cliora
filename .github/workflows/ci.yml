name: Pull request validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  RUSTFLAGS: "-D warnings"
  RUSTDOCFLAGS: "-D warnings"

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend tests and build (${{ matrix.suite }})
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: application
            files: '^(?!.*workbench-(terminal|webgl)\.spec\.ts).*$'
            workers: 8
          # Start the software-GPU tests immediately on their own runner.
          # They remain sequential so renderers cannot starve one another.
          - suite: terminal
            files: 'workbench-(terminal|webgl)\.spec\.ts$'
            workers: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Choose a reachable Ubuntu mirror
        # Playwright installs its system libraries with apt; point apt at a mirror that answers.
        timeout-minutes: 8
        run: bash .github/scripts/install-linux-deps.sh --configure-only

      - name: Install Playwright browser
        timeout-minutes: 15
        run: npx playwright install --with-deps --only-shell chromium

      - name: Test
        # test-ui.mjs type-checks and builds first on a clean checkout.
        run: npm test -- '${{ matrix.files }}' --workers=${{ matrix.workers }}

      - name: Test release gate
        if: matrix.suite == 'application'
        run: node --test tests/native/release-gate.test.mjs

  release-cache:
    name: Prepare release cache (${{ matrix.target }})
    # New tags can read main's caches, but cannot read another tag's caches.
    # Populate release-profile dependencies alongside tests, only on a cache miss.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Release Rust cache
        id: release-cache
        uses: swatinem/rust-cache@v2
        with:
          # Keep this key and workspace identical to release.yml.
          shared-key: release-v1-${{ matrix.target }}
          workspaces: src-tauri -> target
          cache-bin: false

      - name: Install Linux dependencies
        if: steps.release-cache.outputs.cache-hit != 'true' && runner.os == 'Linux'
        timeout-minutes: 10
        run: bash .github/scripts/install-linux-deps.sh

      - name: Install frontend dependencies
        if: steps.release-cache.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Compile release dependencies without packaging or signing
        if: steps.release-cache.outputs.cache-hit != 'true'
        run: npm run tauri -- build --target ${{ matrix.target }} --no-bundle --no-sign -- --locked

  rust:
    name: Rust tests and clippy
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Tauri system dependencies
        timeout-minutes: 10
        run: bash .github/scripts/install-linux-deps.sh

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-workspace-crates: true
          cache-bin: false

      - name: Test
        timeout-minutes: 15
        run: /usr/bin/time -v timeout --signal=TERM --kill-after=15s 12m cargo test --locked --manifest-path src-tauri/Cargo.toml -- --test-threads=4

      - name: Clippy
        timeout-minutes: 10
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  rust-macos:
    name: Rust macOS check and clippy
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-workspace-crates: true
          cache-bin: false

      # Clippy also performs cargo check, including every test target.
      - name: Clippy macOS target
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin --all-targets -- -D warnings

  rust-windows:
    name: Rust Windows check and clippy
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-workspace-crates: true
          cache-bin: false
      # Clippy also performs cargo check, including every test target.
      - name: Clippy Windows target
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
