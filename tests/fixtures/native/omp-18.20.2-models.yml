providers:
  alpha:
    api: openai-responses
    baseUrl: https://alpha.example.test/v1
    apiKey: ${OMP_ALPHA_API_KEY}
    customProviderField:
      keep: true
    models:
      - id: one
        name: One
        contextWindow: 200000
        maxTokens: 16384
        reasoning: true
        input:
          - text
          - image
        thinkingLevelMap:
          low: low
          high: high
        cost:
          input: 1
          output: 2
          cacheRead: 0.1
          cacheWrite: 0.2
        customModelField: keep
      - id: two
        name: Two
        contextWindow: 128000
  beta:
    api: anthropic-messages
    baseUrl: https://beta.example.test
    auth: none
    models:
      - id: small
        name: Small
