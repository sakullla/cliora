defaultModel: custom_provider:fixture/model/example
custom_provider:
  fixture:
    kind: custom
    enabled: true
    api: openai-responses
    options:
      authMode: api-key
      baseURL: https://example.invalid/v1
      apiKey: synthetic-fixture-key
    models:
      model/example:
        name: model/example
        enabled: true
        configuration_source: manual
